set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB"
set -as terminal-features ",xterm*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%d:%p2%d:%p3%dm'
set -g mouse on
set -g status-position top
# Retain scrollback from full-screen CLI applications such as Codex.
set -g alternate-screen off

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Start unnamed sessions at 1, not 0
set-hook -g after-new-session 'if -F "#{==:#{session_name},0}" "run-shell '\''next=1; while tmux has-session -t =\$next 2>/dev/null; do next=\$((next + 1)); done; tmux rename-session -t =0 \$next'\''"'

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
# Start Neovim without the old argv so its pane-specific session can load.
set -g @resurrect-processes '"~nvim->nvim" lazygit yazi'

# The generated palette owns status, picker, menu, and popup colors.
if-shell '[ -r "$HOME/.config/theme-pack/tmux/current.conf" ]' 'source-file "$HOME/.config/theme-pack/tmux/current.conf"'

# Use Vim keys in copy mode
set-window-option -g mode-keys vi
bind-key [ copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Project sessions, Git review and files without leaving the current workspace.
bind T display-popup -E -w 80% -h 80% "sesh picker"
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# tmux 3.6 crashes when Yazi queries cursor style inside a popup. Use a
# regular split until tmux 3.7 or newer, where the popup handling is fixed.
bind e if-shell -F '#{>=:#{version},3.7}' \
  'display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "yazi"' \
  'split-window -v -c "#{pane_current_path}" "yazi"'

# Continuum adds its save command to status-right, after the palette is loaded.
run '~/.tmux/plugins/tpm/tpm'

# Copy the last URL from the pane scrollback instead of tmux-yank's line yank.
bind y run-shell -b '~/.config/tmux/copy-last-url.sh'

# Keep session selection on both keys, overriding Resurrect's manual-save key.
bind C-s choose-tree -Zs
