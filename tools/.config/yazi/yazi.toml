#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 5

[preview]
wrap = "yes"
tab_size = 2
max_width = 1200
max_height = 1800

[opener]
edit = [
  { run = "${EDITOR:-nvim} %s", desc = "$EDITOR", for = "unix", block = true },
]
view = [
  { run = "nvim -R %s", desc = "nvim -R", for = "unix", block = true },
]

[open]
prepend_rules = [
  { mime = "text/*", use = [ "edit", "view", "reveal" ] },
  { mime = "inode/empty", use = [ "edit", "view", "reveal" ] },
  { mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = [ "edit", "view", "reveal" ] },
  { url = "*.{md,markdown,toml,yaml,yml,lua,sh,zsh,bash,ps1,py,js,ts,tsx,json,cs,cpp,h,hpp,sql}", use = [ "edit", "view", "reveal" ] },
]
