[lua]
scripts = ["engaged.lua"]

[[variables.values]]
current_engaged = 0

[[triggers.rules]]
name = "Something has attacked us"
match_type = "regex"
pattern = "^(.+) attacks YOU!$"
event = "IncreaseEngaged"

[[triggers.rules]]
name = "We have attacked something"
match_type = "regex"
pattern = "^You attack (.+)"
event = "IncreaseEngaged"

[[triggers.rules]]
name = "We've ambushed something"
match_type = "regex"
pattern = "^You leap from your cover towards (.+)"
event = "IncreaseEngaged"

[[triggers.rules]]
name = "We've ambushed and killed something"
match_type = "regex"
pattern = "^(.+) slumps over dead from your fatal ambush!"
event = "IncreaseEngaged"

[[triggers.rules]]
name = "We've killed something"
match_type = "regex"
pattern = "^You receive your share of experience -- (.+) points."
event = "KillCaptured"

[[triggers.rules]]
name = "Fleeing"
match_type = "regex"
pattern = "^You flee head over heels.$"
event = "FlyYouFools"


[[events.handlers]]
name = "increase engaged"
event = "IncreasedEngaged"
notification = "You have engaged in combat."
lua = "engaged_increased"


[[events.handlers]]
name = "decrease engaged"
event = "KillCaptured"
notification = "You have killed your target and are no longer engaged."
lua = "engaged_decreased"

[[events.handlers]]
name = "reset engaged"
event = "FlyYouFools"
notification = "You have fled the battle and are no longer engaged."
lua = "reset_engaged"
